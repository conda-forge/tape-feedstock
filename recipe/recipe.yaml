context:
  version: "5.11.0"

package:
  name: tape
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/tape/-/tape-${{ version }}.tgz
  sha256: 8f4a49b65677ee1dd3f01088744cd3f877be10fd656b2ba1987dc0087dd197dd

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - tape --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: tap-producing test harness for node and browsers
  homepage: https://github.com/tape-testing/tape
  repository: https://github.com/tape-testing/tape

extra:
  recipe-maintainers:
    - danielnachun
